name: Dependency scan

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**/package.json'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-scan.yml'
      - 'SECURITY.md'
      - 'docs/SECURITY.md'
      - 'scripts/validate-security-policy.ts'
      - 'scripts/osv-severity-gate.ts'
      - 'tests/cli/osv-severity-gate.test.ts'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**/package.json'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-scan.yml'
      - 'SECURITY.md'
      - 'docs/SECURITY.md'
      - 'scripts/validate-security-policy.ts'
      - 'scripts/osv-severity-gate.ts'
      - 'tests/cli/osv-severity-gate.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Block high and critical production dependency findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate security policy contract
        run: node --experimental-strip-types scripts/validate-security-policy.ts --mode validate

      - name: npm audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Go for OSV Scanner
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install OSV Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: OSV scan lockfile
        shell: bash
        run: |
          if osv-scanner scan -L package-lock.json --format=json > osv-results.json; then
            scan_status=0
          else
            scan_status=$?
          fi
          # Exit 1 means findings; other failures must not become a clean scan.
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
          # Preserve the existing HIGH/CRITICAL threshold using scanner CVSS scores.
          node --strip-types scripts/osv-severity-gate.ts osv-results.json
