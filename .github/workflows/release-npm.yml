name: Release npm packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run release trust workflow without publishing packages'
        required: false
        default: true
        type: boolean
      release_version:
        description: 'Version to simulate in dry-run mode, for example 0.1.0-beta.0'
        required: false
        default: '0.0.0-beta.0'
        type: string
      release_tier:
        description: 'Release tier override for dist-tag selection'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
          - experimental
          - lts

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    env:
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      RELEASE_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
      RELEASE_TIER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tier || 'auto' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|lts)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate bridge minor policy
        run: node --experimental-strip-types scripts/validate-bridge-minor.ts --mode validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build release artifacts
        env:
          # build-onefile-release normally restores tracked release mirrors after
          # packing. The following root-drop smoke test must exercise the fresh
          # mirror, so retain the generated release artifacts for this CI job.
          ATM_RETAIN_RELEASE_ARTIFACTS: '1'
        run: |
          node --experimental-strip-types scripts/build-package-dist.ts
          node --experimental-strip-types scripts/build-root-drop-release.ts
          node --experimental-strip-types scripts/build-onefile-release.ts

      - name: Build release integrity manifest
        run: node --experimental-strip-types scripts/build-release-integrity.ts

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cdxgen --output release/sbom.json --spec-version 1.5 --no-recurse .

      - name: Verify portable release artifacts
        run: |
          npm run validate:root-drop-release
          npm run validate:onefile-release
          npm run validate:runner-reproducibility

      - name: Smoke frozen runners
        run: |
          node release/atm-onefile/atm.mjs --version
          node release/atm-root-drop/atm.mjs --version

      - name: Compute gate full with resumable receipt
        run: npm run validate:full -- --run-id "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Verify npm package contents
        run: npm pack --workspaces --dry-run

      - name: Set npm package versions from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
            echo "Dry-run mode: simulating package version $version"
          fi
          npm version "$version" --workspaces --include-workspace-root --no-git-tag-version

      - name: Validate release version compatibility
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: node --experimental-strip-types scripts/validate-version-compatibility.ts --mode validate --release-tag "$GITHUB_REF_NAME"

      - name: Resolve npm dist-tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
          fi
          node --experimental-strip-types scripts/validate-dist-tag.ts --mode resolve --version "$version" --tier "${RELEASE_TIER_INPUT:-auto}" --github-env "$GITHUB_ENV"

      - name: Refresh deprecations dashboard header
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
          fi
          node -e "const fs=require('fs'); const p='docs/DEPRECATIONS.md'; let text=fs.readFileSync(p,'utf8'); text=text.replace(/^Last release audit: .*$/m, 'Last release audit: '+version+' ('+process.env.NPM_DIST_TAG+') at '+new Date().toISOString()); fs.writeFileSync(p, text);"

      - name: Prepare deprecation reminder
        id: deprecation-reminder
        shell: bash
        run: node --experimental-strip-types scripts/validate-deprecation-policy.ts --mode reminders --github-output "$GITHUB_OUTPUT"

      - name: Open deprecation reminder issue
        if: ${{ steps.deprecation-reminder.outputs.has_reminders == 'true' }}
        uses: actions/github-script@v7
        env:
          DEPRECATION_ISSUE_TITLE: ${{ steps.deprecation-reminder.outputs.issue_title }}
          DEPRECATION_ISSUE_BODY: ${{ steps.deprecation-reminder.outputs.issue_body }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.DEPRECATION_ISSUE_TITLE,
              body: process.env.DEPRECATION_ISSUE_BODY,
              labels: ['release', 'deprecation']
            });

      - name: Publish public workspace closure
        shell: bash
        run: |
          PUBLIC_WORKSPACES=(
            "@ai-atomic-framework/core"
            "@ai-atomic-framework/cli"
            "@ai-atomic-framework/plugin-sdk"
            "@ai-atomic-framework/plugin-rule-guard"
            "@ai-atomic-framework/plugin-governance-local"
            "@ai-atomic-framework/plugin-human-review"
            "@ai-atomic-framework/plugin-review-advisory"
            "@ai-atomic-framework/plugin-experience-loop"
            "@ai-atomic-framework/plugin-behavior-pack"
            "@ai-atomic-framework/adapter-local-git"
            "@ai-atomic-framework/language-js"
            "@ai-atomic-framework/language-python"
            "@ai-atomic-framework/language-csharp"
            "@ai-atomic-framework/integrations-core"
            "@ai-atomic-framework/integration-claude-code"
            "@ai-atomic-framework/integration-copilot"
            "@ai-atomic-framework/integration-codex"
            "@ai-atomic-framework/integration-cursor"
            "@ai-atomic-framework/integration-gemini"
            "@ai-atomic-framework/agent-pack-sdk"
            "@ai-atomic-framework/agent-pack-claude-code"
            "@ai-atomic-framework/agent-pack-cursor"
            "@ai-atomic-framework/agent-pack-copilot"
            "@ai-atomic-framework/agent-pack-gemini"
            "@ai-atomic-framework/agent-pack-windsurf"
            "create-atm"
            "@ai-atomic-framework/atm-markdown-task-source"
          )
          WORKSPACE_ARGS=()
          for workspace in "${PUBLIC_WORKSPACES[@]}"; do
            WORKSPACE_ARGS+=(--workspace "$workspace")
          done
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            npm publish "${WORKSPACE_ARGS[@]}" --include-workspace-root=false --access public --provenance --tag "$NPM_DIST_TAG" --dry-run
          else
            npm publish "${WORKSPACE_ARGS[@]}" --include-workspace-root=false --access public --provenance --tag "$NPM_DIST_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach release artefacts to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/integrity.json
            release/sbom.json
