name: Release npm packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run release trust workflow without publishing packages'
        required: false
        default: true
        type: boolean
      release_version:
        description: 'Version to simulate in dry-run mode, for example 0.1.0-beta.0'
        required: false
        default: '0.0.0-beta.0'
        type: string
      release_tier:
        description: 'Release tier override for dist-tag selection'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
          - experimental
          - lts

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    env:
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      RELEASE_VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
      RELEASE_TIER_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tier || 'auto' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|lts)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # npm Trusted Publishing uses the GitHub Actions OIDC token. Do not
          # create a token-based .npmrc here; that would silently select the
          # legacy NPM_TOKEN path and make the configured publisher unused.

      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0 --registry https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Derive the release version before any build, pack, or smoke gate. Every
      # pre-publish receipt must describe the exact tarball npm will receive.
      - name: Set npm package versions from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
            echo "Dry-run mode: simulating package version $version"
          fi
          # These packages are versioned as one unpublished workspace closure.
          # Do not ask npm to refresh workspace links from the public registry
          # before the first package has been published.
          npm version "$version" --workspaces --include-workspace-root --no-git-tag-version --no-workspaces-update --allow-same-version
          node --experimental-strip-types scripts/set-release-workspace-versions.ts --version "$version"
          echo "ATM_RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Validate bridge minor policy
        run: node --experimental-strip-types scripts/validate-bridge-minor.ts --mode validate

      - name: Validate projected version skew
        run: node --experimental-strip-types scripts/validate-skew-matrix.ts --mode validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build release artifacts
        env:
          # build-onefile-release normally restores tracked release mirrors after
          # packing. The following root-drop smoke test must exercise the fresh
          # mirror, so retain the generated release artifacts for this CI job.
          ATM_RETAIN_RELEASE_ARTIFACTS: '1'
        run: |
          # This entrypoint builds package-dist and reconciles root-drop once.
          # Separate invocations would rebuild the same closure again.
          node --experimental-strip-types scripts/build-onefile-release.ts

      - name: Build release integrity manifest
        run: node --experimental-strip-types scripts/build-release-integrity.ts

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cdxgen --output release/sbom.json --spec-version 1.5 --no-recurse .

      - name: Verify portable release artifacts
        run: |
          npm run validate:root-drop-release
          npm run validate:onefile-release
          npm run validate:runner-reproducibility

      - name: Smoke frozen runners
        run: |
          node release/atm-onefile/atm.mjs --version
          node release/atm-root-drop/atm.mjs --version

      - name: Seal prior package-safety evidence
        run: node --experimental-strip-types scripts/seal-release-prepublish-evidence.ts --output .atm/runtime/release-prepublish-prior-evidence.json

      - name: Compute gate release-prepublish
        run: npm run validate:release-prepublish -- --run-id "release-prepublish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --prior-evidence .atm/runtime/release-prepublish-prior-evidence.json

      - name: Verify npm package contents
        # Seal once; all later gates and publication consume these exact bytes.
        run: node --experimental-strip-types scripts/build-release-artifacts.ts --output release/npm-artifacts

      - name: Verify adopter artifact budget
        run: node --experimental-strip-types scripts/validate-adopter-artifact-manifest.ts --artifact-manifest release/npm-artifacts/manifest.json

      # Hard publish gate. The published CLI is packed and installed on its own
      # in a clean directory, with no sibling workspace present, and then run.
      # beta.1 shipped a tarball whose modules resolved only because the whole
      # workspace closure happened to be installed alongside it; an isolated
      # install is the only check that can observe that class of defect.
      - name: Clean-install npx smoke (publish gate)
        run: node --experimental-strip-types scripts/validate-npm-clean-install.ts --artifact-manifest release/npm-artifacts/manifest.json

      - name: Validate release version compatibility
        shell: bash
        run: node --experimental-strip-types scripts/validate-version-compatibility.ts --mode validate --release-tag "$ATM_RELEASE_TAG"

      - name: Resolve npm dist-tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
          fi
          node --experimental-strip-types scripts/validate-dist-tag.ts --mode resolve --version "$version" --tier "${RELEASE_TIER_INPUT:-auto}" --github-env "$GITHUB_ENV"

      - name: Refresh deprecations dashboard header
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
          fi
          RELEASE_AUDIT_VERSION="$version" node -e "const fs=require('fs'); const p='docs/DEPRECATIONS.md'; let text=fs.readFileSync(p,'utf8'); text=text.replace(/^Last release audit: .*$/m, 'Last release audit: '+process.env.RELEASE_AUDIT_VERSION+' ('+process.env.NPM_DIST_TAG+') at '+new Date().toISOString()); fs.writeFileSync(p, text);"

      - name: Prepare deprecation reminder
        id: deprecation-reminder
        shell: bash
        run: node --experimental-strip-types scripts/validate-deprecation-policy.ts --mode reminders --github-output "$GITHUB_OUTPUT"

      - name: Open deprecation reminder issue
        if: ${{ steps.deprecation-reminder.outputs.has_reminders == 'true' && env.RELEASE_DRY_RUN != 'true' }}
        uses: actions/github-script@v7
        env:
          DEPRECATION_ISSUE_TITLE: ${{ steps.deprecation-reminder.outputs.issue_title }}
          DEPRECATION_ISSUE_BODY: ${{ steps.deprecation-reminder.outputs.issue_body }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.DEPRECATION_ISSUE_TITLE,
              body: process.env.DEPRECATION_ISSUE_BODY,
              labels: ['release', 'deprecation']
            });

      - name: Publish public workspace closure
        # Immutable candidate publication, public verification, then promotion
        shell: bash
        run: |
          dry_run=()
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then dry_run=(--dry-run); fi
          node --experimental-strip-types scripts/release-candidate.ts \
            --manifest release/npm-artifacts/manifest.json \
            --target-tag "$NPM_DIST_TAG" "${dry_run[@]}"

      - name: Attach immutable artifacts and promotion proof
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-artifact-parity
          path: release/npm-artifacts
          if-no-files-found: error

      - name: Post-publish full validation
        if: ${{ always() && !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        timeout-minutes: 45
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$RELEASE_DRY_RUN" == "true" ]]; then
            release_version="${RELEASE_VERSION_INPUT:-0.0.0-beta.0}"
          fi
          ATM_RELEASE_TAG="$release_version" npm run validate:full -- --run-id "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --validator-timeout-ms 300000

      - name: Attach release artefacts to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/integrity.json
            release/sbom.json
            release/npm-artifacts/*.tgz
            release/npm-artifacts/manifest.json
            release/npm-artifacts/proof/promotion.json

